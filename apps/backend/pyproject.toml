[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kervcodes", email = "kervintz84@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.10",
    "pypdf>=6.4.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv.build-backend]
module-name = "app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
